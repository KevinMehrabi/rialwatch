name: Deploy Latest Site

on:
  workflow_run:
    workflows:
      - Daily USD/IRR Reference
      - Regional Diagnostics Discovery
      - Historical Chart Recovery
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Collection triggers daily publication first, so Pages does not race the
# publisher and briefly redeploy yesterday's reference after a fresh collection.
# Collection and persistence never wait for Pages. Only this workflow deploys,
# and each queued run rebuilds from the newest committed data/live snapshot.
# Finish an active deployment instead of interrupting it during artifact discovery.
concurrency:
  group: rialwatch-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # 75-minute shared outage budget + four bounded deployment attempts,
    # backoff, build, and public verification. Collection uses separate jobs.
    timeout-minutes: 110
    env:
      # Re-running a failed job must not collide with its earlier upload.
      PAGES_ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url || steps.deployment_late.outputs.page_url || steps.deployment_final.outputs.page_url }}
    steps:
      - name: Checkout current application
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set a shared recovery deadline
        run: echo "PAGES_RECOVERY_DEADLINE=$(( $(date +%s) + 75 * 60 ))" >> "$GITHUB_ENV"
      - name: Wait for a declared GitHub outage to clear
        run: python3 scripts/wait_for_pages.py --deadline "$PAGES_RECOVERY_DEADLINE"
      # Read data after the outage wait, so a waiting job does not publish an
      # unnecessarily old snapshot when GitHub recovers.
      - name: Checkout latest committed data
        uses: actions/checkout@v4
        with:
          ref: data/live
          path: state
      - name: Rebuild a consistent site from the latest snapshot
        run: python3 scripts/pipeline.py --site-dir state/site --templates-dir templates --no-new-reference
      - name: Record the exact release to verify on the public site
        run: |
          python3 scripts/verify_deployment.py prepare --site-dir state/site \
            --application-sha "$(git rev-parse HEAD)" --data-sha "$(git -C state rev-parse HEAD)" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: ${{ env.PAGES_ARTIFACT_NAME }}
          path: state/site
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT_NAME }}
          timeout: 300000
      # Keep the official action. Its initial artifact lookup and deployment
      # creation are not retried internally. A declared outage can start after
      # preflight, so each retry checks status against the SAME deadline.
      - name: Recover before the second deployment attempt
        if: steps.deployment.outcome == 'failure'
        run: |
          sleep 15
          python3 scripts/wait_for_pages.py --deadline "$PAGES_RECOVERY_DEADLINE"
      - name: Retry Pages deployment
        if: steps.deployment.outcome == 'failure'
        id: deployment_retry
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT_NAME }}
          timeout: 300000
      - name: Recover before the third deployment attempt
        if: steps.deployment_retry.outcome == 'failure'
        run: |
          sleep 60
          python3 scripts/wait_for_pages.py --deadline "$PAGES_RECOVERY_DEADLINE"
      - name: Retry Pages after a longer service interruption
        if: steps.deployment_retry.outcome == 'failure'
        id: deployment_late
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT_NAME }}
          timeout: 300000
      - name: Recover before the final deployment attempt
        if: steps.deployment_late.outcome == 'failure'
        run: |
          sleep 180
          python3 scripts/wait_for_pages.py --deadline "$PAGES_RECOVERY_DEADLINE"
      - name: Final Pages deployment attempt
        if: steps.deployment_late.outcome == 'failure'
        id: deployment_final
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT_NAME }}
          timeout: 300000
      - name: Verify the released pages and data on rialwatch.com
        run: python3 scripts/verify_deployment.py check --site-dir state/site --base-url https://rialwatch.com --wait-seconds 180
