name: Intraday USD/IRR Collection

on:
  schedule:
    # Start early, then wait inside the job for in-window collection checkpoints.
    # GitHub scheduled runs can start tens of minutes late; this gives the job
    # enough buffer to still collect during the 13:45-14:15 UTC publication window.
    - cron: "30 12 * * *"
    # Backup triggers reduce the chance that one delayed GitHub cron leaves the
    # daily publisher with zero same-day intraday artifacts.
    - cron: "0 13 * * *"
    - cron: "30 13 * * *"
    # Independent observations across the UTC day preserve recoverable reads
    # even when the main publication window or Pages deployment is missed.
    - cron: "37 5,9,17,21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: intraday-usd-irr-collection
  cancel-in-progress: false

jobs:
  collect_intraday:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Ensure data branch exists
        run: |
          if git ls-remote --exit-code --heads origin data/live >/dev/null 2>&1; then
            echo "data/live already exists."
          else
            echo "Bootstrapping data/live from current main."
            git push origin HEAD:data/live
          fi

      - name: Checkout data branch
        uses: actions/checkout@v4
        with:
          ref: data/live
          path: state
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright (Bonbast browser collector)
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium

      - name: Collect one intraday attempt
        env:
          COLLECTION_SCHEDULE: ${{ github.event.schedule }}
          ALANCHAND_API_KEY: ${{ secrets.ALANCHAND_API_KEY }}
          BONBAST_SITE_URL: ${{ vars.BONBAST_SITE_URL }}
          NAVASAN_PUBLIC_URL: ${{ vars.NAVASAN_PUBLIC_URL }}
          ALANCHAND_API_URL: ${{ secrets.ALANCHAND_API_URL }}
        run: |
          if [ "$COLLECTION_SCHEDULE" = "37 5,9,17,21 * * *" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            collection_args=(--allow-outside-window)
          else
            collection_args=(--collect-sample-times --sample-times-utc 13:50,14:05,14:14)
          fi
          python3 scripts/pipeline.py --mode collect-intraday --site-dir state/site --templates-dir templates "${collection_args[@]}" --observation-backup-dir "$RUNNER_TEMP/rialwatch-observations"

      - name: Back up raw observations independently of Git persistence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intraday-observations-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rialwatch-observations/
          if-no-files-found: error
          retention-days: 90

      - name: Persist intraday snapshots
        # Attempt Git persistence even if the separate artifact upload fails.
        if: ${{ !cancelled() }}
        run: |
          data_branch="data/live"
          today="$(date -u +%F)"
          target_dir="site/intraday"
          targets=()
          if [ -d "state/${target_dir}" ]; then
            targets+=("$target_dir")
          fi
          if [ -e "state/site/api/intraday/latest.json" ]; then
            targets+=("site/api/intraday/latest.json")
          fi

          if [ "${#targets[@]}" -eq 0 ]; then
            echo "::error::No intraday artifacts available to persist."
            exit 1
          fi

          if [ -z "$(git -C state status --porcelain -- "${targets[@]}")" ]; then
            echo "No intraday changes to commit."
            exit 0
          fi

          git -C state config user.name "github-actions[bot]"
          git -C state config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C state add "${targets[@]}"
          git -C state commit -m "collect: intraday USD/IRR sample ${today} [skip ci]"

          for attempt in 1 2 3; do
            if git -C state push origin "${data_branch}"; then
              echo "Push succeeded on attempt ${attempt}."
              exit 0
            fi
            echo "Push rejected on attempt ${attempt}; rebasing onto origin/${data_branch} and retrying..."
            if ! git -C state pull --rebase --autostash origin "${data_branch}"; then
              echo "::error::Could not persist observations after a concurrent data update. Recover the raw observation artifact from this run."
              exit 1
            fi
          done

          echo "::error::Failed to push intraday snapshots to ${data_branch} after 3 attempts. Recover the raw observation artifact from this run."
          exit 1
