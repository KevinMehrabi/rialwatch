<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Independent daily Iranian rial benchmark, market indicators, and regional diagnostics.">
<title>${title} — RialWatch</title>
<script>
(() => {
  try {
    const saved = localStorage.getItem('rw-theme');
    document.documentElement.dataset.theme = saved === 'light' ? 'light' : 'dark';
  } catch (_) { /* Dark is the existing first-visit default. */ }
})();
</script>
<link rel="icon" href="/assets/rwicon_white.svg" type="image/svg+xml">
<link rel="preload" href="/assets/fonts/fraunces-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/ibm-plex-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/tabler/tabler.min.css">
<link rel="stylesheet" href="/assets/css/dashboard.css?v=20261012-history">
<script src="/assets/js/site-shell.js?v=20261012-history" defer></script>
</head>
<body>
<header class="site-header">
  <div class="site-header-inner">
    <a class="site-brand" href="/">
      <span class="site-logo-wrap">
        <img class="site-logo logo-dark" src="/assets/rwicon_white.svg" width="54" height="54" alt="RialWatch logo">
        <img class="site-logo logo-light" src="/assets/rwicon_dark.svg" width="54" height="54" alt="RialWatch logo">
      </span>
      <span class="site-brand-copy"><span class="site-title">RialWatch</span> <span class="site-subtitle">Independent Iranian Rial (IRR) Benchmark</span></span>
    </a>
    <nav class="site-nav" aria-label="Main navigation">
      <a href="/methodology/">Methodology</a>
      <a href="/status/">Status</a>
    </nav>
    <div class="site-updated" id="site-last-update" data-ts="${generated_at}" title="Site update time. Individual benchmark observations may be older.">
      <span class="updated-label">Site updated</span><time datetime="${generated_at}">${generated_at}</time>
    </div>
    <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Switch to light mode">
      <span class="theme-toggle-track" aria-hidden="true"><span class="theme-toggle-thumb">
        <svg class="moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </span></span>
    </button>
  </div>
</header>
<main class="dashboard-container">${content}</main>
<footer class="site-footer">
  <div class="site-generated-at">Site updated: ${generated_at}</div>
  <div class="site-footer-credit">A Kevin Mehrabi Production</div>
  <div class="site-footer-contact">Contact: <a href="https://linktr.ee/kmehrabi" target="_blank" rel="noopener noreferrer">@KMehrabi</a></div>
</footer>
</body>
</html>
